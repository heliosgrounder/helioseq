name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; the jobs here only ever read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # A silent fallback to the pure-Python backend would make a broken build look
  # like a passing one. Everything in CI must fail loudly instead.
  HELIOSEQ_REQUIRE_EXTENSION: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported range on every OS. The abi3 build means
        # the binding does not vary across the versions in between, so those
        # get one platform each rather than three.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[test,ml,torch]"

      - name: Confirm the compiled backend is live
        run: >
          python -c "import helioseq, sys;
          b = helioseq.shuffle.backend();
          print('backend:', b);
          sys.exit(0 if b == 'c' else 1)"

      - name: Test (compiled backend)
        run: python -m pytest tests -q

      # The fallback is a supported code path, not a safety net nobody runs:
      # it has to pass the same assertions, and it has to agree with the C
      # implementation byte for byte.
      - name: Test (pure-Python fallback)
        env:
          HELIOSEQ_BACKEND: python
        run: python -m pytest tests -q

  c-core:
    name: C core (sanitizers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: AddressSanitizer + UndefinedBehaviorSanitizer
        run: make ctest-asan

      - name: Optimised build
        run: make ctest

      # The two backends are supposed to be byte-identical. Regenerating the
      # golden vectors and finding a diff means the C side moved, which would
      # silently change every user's results.
      - name: Golden vectors are still current
        run: |
          make golden
          if ! git diff --quiet tests/data/golden.json; then
            echo "::error file=tests/data/golden.json::the C core's output changed; this alters results for every user. If the change is intended, commit the regenerated file and say so in CHANGELOG.md."
            git --no-pager diff tests/data/golden.json
            exit 1
          fi

  structure:
    name: Layering, docs and conventions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: python -m pip install -e ".[test,ml,torch]"

      - name: Import layering matches docs/architecture.md
        run: python -m pytest tests/test_package.py -q

      - name: Every docstring example runs
        run: python -m pytest tests/test_docs.py -q

  no-compiler:
    name: Installs without a compiler
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # This job asserts the opposite of the workflow default: a missing
      # compiler must degrade to the pure-Python backend, not fail the install.
      HELIOSEQ_REQUIRE_EXTENSION: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install with every compiler hidden
        run: |
          mkdir -p "$HOME/nocc"
          for tool in cc gcc g++ clang clang++ x86_64-linux-gnu-gcc ccache; do
            printf '#!/bin/sh\necho "no compiler available (CI test)" >&2\nexit 127\n' \
              > "$HOME/nocc/$tool"
            chmod +x "$HOME/nocc/$tool"
          done
          PATH="$HOME/nocc:$PATH" CC=cc CXX=c++ python -m pip install -e ".[test]"

      - name: It still imports, on the fallback
        run: >
          python -c "import helioseq, sys;
          b = helioseq.shuffle.backend();
          print('backend:', b);
          sys.exit(0 if b == 'python' else 1)"

      - name: And it still passes the suite
        run: python -m pytest tests -q

  # lint:
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 10
  #   steps:
  #     - uses: actions/checkout@v7
  #     - uses: actions/setup-python@v7
  #       with:
  #         python-version: "3.13"

  #     - run: python -m pip install -e ".[dev,test,ml]"

  #     - name: ruff check
  #       run: python -m ruff check src tests benchmarks

  #     - name: ruff format
  #       run: python -m ruff format --check src tests benchmarks

  #     # Advisory for now: the annotations are incomplete, and a red X on every
  #     # PR for a known gap trains people to ignore red Xs. Drop the flag once
  #     # `make typecheck` is clean.
  #     - name: mypy
  #       continue-on-error: true
  #       run: python -m mypy

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: python -m pip install -e ".[test,ml,torch]"

      # Measured on the pure-Python backend so the shuffling core counts as
      # Python lines; the C backend would show that file as unexecuted.
      - name: Run with coverage
        env:
          HELIOSEQ_BACKEND: python
        run: python -m pytest tests -q --cov=helioseq --cov-report=term-missing

      - name: Report to the job summary
        if: always()
        env:
          HELIOSEQ_BACKEND: python
        run: |
          {
            echo '### Coverage'
            echo '```'
            python -m coverage report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  packaging:
    name: sdist builds from scratch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: python -m pip install build twine

      - name: Build and check
        run: |
          python -m build --sdist
          python -m twine check dist/*

      # The sdist must carry everything needed to rebuild the extension. 1.x
      # shipped stale generated C, which is exactly how an sdist rots.
      - name: The sdist contains the sources, not just the package
        run: |
          listing=$(tar -tzf dist/*.tar.gz)
          for required in \
            src/libushuffle/ushuffle.c \
            src/libushuffle/ushuffle.h \
            src/libushuffle/prng.h \
            src/libushuffle/LICENSE.original \
            src/helioseq/shuffle/_core.c \
            tests/c/test_libushuffle.c \
            tests/data/golden.json
          do
            echo "$listing" | grep -q "/$required$" \
              || { echo "::error::sdist is missing $required"; exit 1; }
          done
          echo "$listing" | grep -qE '\.so$|\.pyd$' \
            && { echo "::error::sdist contains built artefacts"; exit 1; }
          echo "sdist contents OK"

      - name: Install the sdist in a clean directory
        run: |
          mkdir empty && cd empty
          python -m pip install ../dist/*.tar.gz
          python -c "import helioseq; assert helioseq.shuffle.backend() == 'c'; print(helioseq.shuffle.shuffle('ACGTACGTAGCT', 2, seed=1))"
          helioseq info

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          retention-days: 7
